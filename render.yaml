services:
  - type: web
    name: reachinbox-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # Neon pooled URL: postgresql://neondb_owner:...@...-pooler...neon.tech/neondb?sslmode=require
      - key: DIRECT_URL
        sync: false  # Same as DATABASE_URL for Neon pooler
      - key: REDIS_URL
        sync: false  # Upstash Redis URL: rediss://default:...
      - key: FRONTEND_URL
        sync: false  # https://<your-app>.vercel.app
      - key: BACKEND_URL
        sync: false  # https://<your-api>.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false  # 64-char hex string
      - key: GOOGLE_CLIENT_ID
        value: 940090647553-9bu57m9cm1goa965ei2eo9501j5q8vhh.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false  # https://<your-api>.onrender.com/api/auth/google/callback
      - key: SLACK_CLIENT_ID
        value: mock_or_real_slack_client_id
      - key: SLACK_CLIENT_SECRET
        value: mock_or_real_slack_client_secret
      - key: SLACK_CALLBACK_URL
        sync: false
      - key: SLACK_NOTIFICATIONS_ENABLED
        value: "true"
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: "587"
      - key: ETHEREAL_USER
        value: ""
      - key: ETHEREAL_PASS
        value: ""
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      - key: RATE_LIMIT_TIMEZONE
        value: UTC
      - key: BULL_BOARD_USERNAME
        value: admin
      - key: BULL_BOARD_PASSWORD
        sync: false
      - key: ELASTICSEARCH_NODE
        value: http://localhost:9200
